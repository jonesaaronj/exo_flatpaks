app-id: com.retro_exo.zenity
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: zenity
finish-args:
  - --share=ipc
  - --socket=x11
  - --filesystem=host
  - --env=GTK_THEME=Adwaita:dark

modules:
  - name: zenity
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.2.tar.xz
        sha256: 019186a996096ef4fc356e21577b5673f5baa3a29ac8e3d608b753371c18018d
