id: com.retro_exo.falkon
runtime: org.kde.Platform
runtime-version: "6.11"
base: io.qt.qtwebengine.BaseApp
base-version: "6.11"
sdk: org.kde.Sdk
command: falkon
appstream-compose: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --system-talk-name=org.freedesktop.GeoClue2
  - --system-talk-name=org.freedesktop.UPower.*
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --own-name=org.mpris.MediaPlayer2.falkon.*
  - --filesystem=host
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - "*.la"
  - "*.a"
  - /share/applications
  - /share/icons
  - /share/metainfo
  - /share/appdata
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - buildsystem: cmake-ninja
    name: falkon
    config-opts:
      - -DENABLE_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/release-service/26.08.1/src/falkon-26.08.1.tar.xz
        sha256: 74df8eebd3d198392a35e79cee5d554b9f48ed88a5f3e6906caded1b3698257e
        x-checker-data:
          type: anitya
          project-id: 8763
          stable-only: true
          url-template: https://download.kde.org/stable/release-service/$version/src/falkon-$version.tar.xz
