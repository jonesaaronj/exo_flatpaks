id: com.retro_exo.wine
default-branch: stable-25.08
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
command: start-wine

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --share=network
  - --allow=multiarch
  - --allow=devel
  - --system-talk-name=org.freedesktop.UDisks2
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  - --filesystem=host
  - --env=WINEPREFIX=/var/data/wine
  - --env=FONTCONFIG_FILE=/etc/fonts/fonts.conf

modules:
  - name: box64
    buildsystem: cmake
    config-opts:
      - -DARM_DYNAREC=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/ptitSeb/box64.git
        branch: main
      - type: shell
        commands:
          - sed -i 's|DESTINATION /etc|DESTINATION etc|g' CMakeLists.txt
          - sed -i 's|/usr/lib/box64-x86_64-linux-gnu|lib/box64-x86_64-linux-gnu|g' CMakeLists.txt

  # Wine 11.0, built from the Kron4ek/Wine-Builds scripts with one patch applied:
  # cmd's WCMD_wait_for_input() waits on the console input handle before issuing
  # any read, which deadlocks on a Wine unix console because the input object
  # cannot become signaled until conhost's tty reader thread is started -- and
  # that thread is only started by a read or peek ioctl.  Without the patch
  # `wine cmd /c pause` hangs forever, which is what the eXo SystemShock
  # launcher (SSP.exe -> cmd /s/c SSP.bat -> pause) trips over.
  #
  # Not macOS- or ARM-specific; it reproduces on plain x86_64 Linux too, and
  # WCMD_wait_for_input() is unchanged in upstream master.  Drop this custom
  # build and return to Kron4ek's release once the fix lands upstream.
  - name: wine-amd64-wow64
    buildsystem: simple
    build-commands:
      - mkdir -p /app/wine
      - cp -r * /app/wine/
    sources:
      - type: archive
        url: https://github.com/jonesaaronj/exo_flatpaks/releases/download/source_bundles/wine-11.0-amd64-wow64.tar.xz
        sha256: 4810b2b0f53d36441004c9cfa77b262ce3dc5359c0f519d0cda72570babfc27e

  # Wine looks in $WINEDATADIR ( = /app/wine/share/wine ) for mono/gecko before
  # prompting the user to download them. Extracted tarballs are used as a
  # "shared install": nothing is copied into the wineprefix, so first run is
  # instant and one copy serves every prefix. Versions must match what this
  # Wine build expects (see dlls/appwiz.cpl/addons.c for wine-11.0:
  # mono 10.4.1, gecko 2.47.4).
  - name: wine-mono
    buildsystem: simple
    build-commands:
      - mkdir -p /app/wine/share/wine/mono/
      - cp -a wine-mono-* /app/wine/share/wine/mono/
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.tar.xz
        strip-components: 0
        sha256: a16606ef0724202e6a6848ece6e0cbba64d11e2f11aefe744af1d93c6d9f99bb

  - name: wine-gecko
    buildsystem: simple
    build-commands:
      - mkdir -p /app/wine/share/wine/gecko/
      - cp -a wine-gecko-* /app/wine/share/wine/gecko/
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.tar.xz
        strip-components: 0
        sha256: 2cfc8d5c948602e21eff8a78613e1826f2d033df9672cace87fed56e8310afb6
      - type: archive
        url: https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.tar.xz
        strip-components: 0
        sha256: fd88fc7e537d058d7a8abf0c1ebc90c574892a466de86706a26d254710a82814

  # x86_64 libraries required by Box64 when emulating Wine's x86_64 code.
  # Box64 wraps libc/libdl/etc. natively but NOT libgcc_s or libstdc++,
  # so the x86_64 copies must be shipped alongside Wine.
  - name: x86_64-libs
    buildsystem: simple
    build-commands:
      - ar x libgcc-s1.deb && tar xf data.tar.* && install -D lib/x86_64-linux-gnu/libgcc_s.so.1
        /app/wine/lib64/libgcc_s.so.1 && rm -rf data.tar.* control.tar.* debian-binary lib
      - ar x libstdcpp6.deb && tar xf data.tar.* && cp -a usr/lib/x86_64-linux-gnu/libstdc++.so.6*
        /app/wine/lib64/
    sources:
      - type: file
        url: https://ftp.debian.org/debian/pool/main/g/gcc-12/libgcc-s1_12.2.0-14+deb12u1_amd64.deb
        sha256: 3016e62cb4b7cd8038822870601f5ed131befe942774d0f745622cc77d8a88f7
        dest-filename: libgcc-s1.deb
      - type: file
        url: https://ftp.debian.org/debian/pool/main/g/gcc-12/libstdc++6_12.2.0-14+deb12u1_amd64.deb
        sha256: 5cd3171216d4ab0fc911cfe9c35509bf2dd8f47761c43b7f6a4296701551a24d
        dest-filename: libstdcpp6.deb

  - name: entrypoint
    buildsystem: simple
    build-commands:
      - install -D -m 755 start-wine.sh /app/bin/start-wine
    sources:
      - type: file
        path: start-wine.sh
