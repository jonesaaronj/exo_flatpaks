---
app-id: com.retro_exo.dosbox-x-20250201
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: dosbox-x
appstream-compose: false

finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=host

cleanup:
  - '/include'
  - '/lib/pkgconfig'
  - '/share/aclocal'
  - '/share/man'
  - '*.la'
  - '*.a'
  - '/share/doc'
  - '/share/applications'
  - '/share/icons'
  - '/share/metainfo'
  - '/share/appdata'

modules:

  # Build Mesa GLU
  - "../../shared-modules/glu/glu-9.json"

  # Build FluidSynth for General MIDI emulation
  - "../../shared-modules/linux-audio/fluidsynth2.json"

  # Build libslirp for TCP/IP networking
  - name: libslirp
    buildsystem: meson
    cleanup:
      - "/include"
      - "/lib/pkgconfig"
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.gz
        sha256: 3970542143b7c11e6a09a4d2b50f30a133473c41f15ed0bdcc3b7a1c450d9a5c
        x-checker-data:
          type: anitya
          project-id: 96796
          url-template: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v$version/libslirp-v$version.tar.gz

  - name: ffmpeg
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.6.tar.gz
        sha256: e8be3fdcf272685f18c9334d4d2122e11164448bfc358fe0be2a1a97ef1f94d8 # Update to match your version's checksum
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --enable-gpl

  # Build DOSBox-X SDL2
  - name: dosbox-x
    buildsystem: autotools
    config-opts:
      - --enable-core-inline
      - --enable-sdl2
    sources:
      - type: archive
        url: https://github.com/joncampbell123/dosbox-x/archive/refs/tags/dosbox-x-v2025.02.01.tar.gz
        sha256: 3a6fdfd659bb05db82bf2d850af806f666562cce9a37609fd33b59f7e4bd8fa4
    x-checker-data:
      type: anitya
      project-id: 242383
      stable-only: true
      tag-template: dosbox-x-v$version
...
