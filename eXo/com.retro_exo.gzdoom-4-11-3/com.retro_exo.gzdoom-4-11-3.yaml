app-id: com.retro_exo.gzdoom-4-11-3
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
runtime-version: "25.08"
command: gzdoom.sh

finish-args:
  - --device=dri
  - --socket=x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --filesystem=host

  # Based on GZDoom
  # We redirect the original ~/.config/gzdoom
  - --env=DOOMWADDIR=/app/share/games/doom
  - --persist=.config/gzdoom

  # Controller support on SteamDeck and such
  - --device=all

  # Simpler way of preventing KDE related errors
  - --env=KDE_FULL_SESSION=false

cleanup:
  - /app/include
  - /app/lib/*.a
  - /app/lib/*.la
  - /app/lib/pkgconfig

modules:

  - name: gzdoom
    buildsystem: cmake-ninja
    build-options:
      cflags: -std=gnu17 -Wno-error=incompatible-pointer-types
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    cleanup:
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig
      - /include
    sources:
      - type: archive
        url: https://github.com/ZDoom/gzdoom/archive/refs/tags/g4.11.3.tar.gz
        sha256: 5943dba50da20ff94f1fcc415132672d42a15917c571b1c2b7ceefe14935f5d5
        x-checker-data:
          type: anitya
          project-id: 17531
          stable-only: true
          tag-template: g$version
      - type: patch
        path: description.patch
    modules:
      - ../../shared-modules/linux-audio/libinstpatch.json
      - ../../shared-modules/linux-audio/fluidsynth2.json
      - name: libsndfile
        buildsystem: cmake-ninja
        sources:
          - type: git
            url: https://github.com/libsndfile/libsndfile.git
            commit: 68f6c16fe1407eff4cdde158566694c3ed666c2f
            x-checker-data:
              type: anitya
              project-id: 13277
              stable-only: true
              url-template: https://github.com/libsndfile/libsndfile/releases/download/$version/libsndfile-$version.tar.xz
      - name: game-music-emu
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        sources:
          - type: archive
            url: https://bitbucket.org/mpyne/game-music-emu/downloads/game-music-emu-0.6.3.tar.gz
            sha256: 626e8a104e0dadd10ef6519a67aca880c7b40f81471659f1935b61754e12fc7b
            x-checker-data:
              type: anitya
              project-id: 866
              stable-only: true
              url-template: https://bitbucket.org/mpyne/game-music-emu/downloads/game-music-emu-$version.tar.gz
      - name: zmusic
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=RelWithDebInfo
        sources:
          - type: archive
            url: https://github.com/ZDoom/ZMusic/archive/refs/tags/1.3.0.tar.gz
            sha256: 2eccd41e1cc9b38b3729ab94d65635719b2adc916de4ca9f8399ebceaee89f7f
            x-checker-data:
              type: anitya
              project-id: 153600
              stable-only: true
              url-template: https://github.com/zdoom/ZMusic/archive/$version.tar.gz

  # Tiny probe: exits 0 if a GL 3.3 core context can be created, 1 if not.
  # Uses the runtime's SDL2 and the same driver stack GZDoom itself will use.
  - name: gl33probe
    buildsystem: simple
    sources:
      - type: inline
        dest-filename: gl33probe.c
        contents: |
          #include <SDL.h>
          int main(void) {
              if (SDL_Init(SDL_INIT_VIDEO) != 0) return 2;
              SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_CORE);
              SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 3);
              SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 3);
              SDL_Window *w = SDL_CreateWindow("gl33probe", 0, 0, 32, 32,
                                               SDL_WINDOW_OPENGL | SDL_WINDOW_HIDDEN);
              if (!w) { SDL_Quit(); return 1; }
              SDL_GLContext c = SDL_GL_CreateContext(w);
              if (c) SDL_GL_DeleteContext(c);
              SDL_DestroyWindow(w);
              SDL_Quit();
              return c ? 0 : 1;
          }
    build-commands:
      - gcc -O2 -o gl33probe gl33probe.c $(pkg-config --cflags --libs sdl2)
      - install -D gl33probe /app/bin/gl33probe

  - name: launcher
    buildsystem: simple
    sources:
      - type: script
        commands:
          - '# Backend selection (vid_preferbackend: 0=OpenGL 3.3, 1=Vulkan, 2=OpenGL ES)'
          - '# The backend is pinned per launch based on a GL 3.3 core probe, because'
          - '# vid_preferbackend is an archived cvar: a run on a sub-3.3 system (e.g.'
          - '# Raspberry Pi) writes 2 back to the ini, and a shared/portable ini would'
          - '# otherwise carry that to capable systems. Probe exit 0 -> pin 0 (OpenGL),'
          - '# exit 1 -> pin 2 (GLES), anything else (e.g. no display) -> leave stock.'
          - '# GZDOOM_BACKEND, if set (e.g. flatpak override --user'
          - '# --env=GZDOOM_BACKEND=N), skips the probe and forces backend N. Caller'
          - '# args still win: "$@" comes after, and later +cvars override earlier ones.'
          - 'BACKEND_ARGS=""'
          - 'if [ -n "${GZDOOM_BACKEND:-}" ]; then'
          - '  BACKEND_ARGS="+vid_preferbackend ${GZDOOM_BACKEND}"'
          - 'else'
          - '  /app/bin/gl33probe'
          - '  case $? in'
          - '    0) BACKEND_ARGS="+vid_preferbackend 0" ;;'
          - '    1) BACKEND_ARGS="+vid_preferbackend 2" ;;'
          - '  esac'
          - 'fi'
          - 'exec gzdoom +fluid_patchset /app/share/games/doom/soundfonts/gzdoom.sf2 ${BACKEND_ARGS} "$@"'
        dest-filename: gzdoom.sh
    build-commands:
      - install -D gzdoom.sh /app/bin/gzdoom.sh
